<!doctype html><html><head><meta charset="utf-8"><title>UsagePass · Category standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#f3f4f6;color:#111827;font:15px/1.5 system-ui,sans-serif}
header{background:#fff;height:64px;display:flex;align-items:center;gap:28px;padding:0 32px;border-bottom:1px solid #e5e7eb}
header b{color:#6d5efc;font-size:20px}header a{color:#6b7280}header a.on{color:#111827;font-weight:600}
.wrap{display:grid;grid-template-columns:1fr 440px;gap:24px;padding:32px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px}
h1{font-size:24px;margin-bottom:16px}
textarea{width:100%;height:120px;border:1px solid #d1d5db;border-radius:8px;padding:12px;font:inherit}
.btn{display:inline-block;margin-top:14px;background:#6d5efc;color:#fff;padding:11px 18px;border-radius:8px;font-weight:600}
.li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6}
.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
</style></head><body>
<header><b>UsagePass</b><a class="on">Requests</a><a>Works</a><a>Licenses</a><a>Payouts</a></header>
<div class="wrap">
  <div class="card"><h1>New usage request</h1><textarea>Paid ads on Instagram and TikTok, Canada and the US, three months, caption edits, and model training.</textarea><span class="btn">Get quote</span></div>
  <div class="card"><h1>Quote <span class="badge">Pending payment</span></h1>
    <div class="li"><span>Base license</span><span>$200.00</span></div>
    <div class="li"><span>Paid ads 90 days</span><span>$80.00</span></div>
    <div class="li"><span>US territory</span><span>$30.00</span></div>
    <div class="li"><span>Model training</span><span>Not allowed</span></div>
    <div class="li"><strong>Total</strong><strong>$310.00</strong></div>
    <span class="btn">Pay with PayPal</span></div>
</div>
</body></html>
